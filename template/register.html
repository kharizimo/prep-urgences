<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Inscription - Prep Sante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="registerTitle">
        <a class="auth-brand" href="index.html">
          <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
          <span>
            <strong>Prep Sant&eacute;</strong>
            <small>Pr&eacute;paration aux Urgences</small>
          </span>
        </a>

        <div class="auth-heading">
          <p class="eyebrow mb-1">Inscription</p>
          <h1 id="registerTitle">Creer un compte</h1>
          <p>Renseignez vos informations pour acceder au suivi des preparations sanitaires.</p>
        </div>

        <form class="auth-form" action="login.html">
          <div>
            <label class="form-label" for="registerName">Nom</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-person"></i></span>
              <input class="form-control" id="registerName" name="name" type="text" autocomplete="name" placeholder="Nom complet" required>
            </div>
          </div>

          <div>
            <label class="form-label" for="registerEmail">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input class="form-control" id="registerEmail" name="email" type="email" autocomplete="email" placeholder="utilisateur@prep-sante.cd" required>
            </div>
          </div>

          <div>
            <label class="form-label" for="registerPassword">Mot de passe</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-lock"></i></span>
              <input class="form-control" id="registerPassword" name="password" type="password" autocomplete="new-password" placeholder="Minimum 8 caracteres" minlength="8" required>
            </div>
          </div>

          <div>
            <label class="form-label" for="registerPasswordConfirm">Confirmation</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-shield-lock"></i></span>
              <input class="form-control" id="registerPasswordConfirm" name="password_confirmation" type="password" autocomplete="new-password" placeholder="Confirmer le mot de passe" minlength="8" required>
            </div>
          </div>

          <button class="btn btn-primary auth-submit" type="submit">
            <i class="bi bi-person-plus"></i>
            Creer le compte
          </button>
        </form>

        <p class="auth-switch">Vous avez deja un compte ? <a href="login.html">Se connecter</a></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
