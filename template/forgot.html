<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Mot de passe oublie - Prep Sante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="forgotTitle">
        <a class="auth-brand" href="index.html">
          <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
          <span>
            <strong>Prep Sant&eacute;</strong>
            <small>Pr&eacute;paration aux Urgences</small>
          </span>
        </a>

        <div class="auth-heading">
          <p class="eyebrow mb-1">Recuperation</p>
          <h1 id="forgotTitle">Mot de passe oublie</h1>
          <p>Saisissez votre adresse email pour recevoir les instructions de reinitialisation.</p>
        </div>

        <form class="auth-form" action="otp.html">
          <div>
            <label class="form-label" for="forgotEmail">Email</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-envelope"></i></span>
              <input class="form-control" id="forgotEmail" name="email" type="email" autocomplete="email" placeholder="votre.email@prep-sante.cd" required>
            </div>
          </div>

          <button class="btn btn-primary auth-submit" type="submit">
            <i class="bi bi-send"></i>
            Envoyer le lien
          </button>
        </form>

        <p class="auth-switch"><a href="login.html">Retour a la connexion</a></p>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
