<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Code de verification - Prep Sante</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="assets/styles.css" rel="stylesheet">
  </head>
  <body class="auth-page">
    <main class="auth-shell">
      <section class="auth-card" aria-labelledby="otpTitle">
        <a class="auth-brand" href="index.html">
          <span class="brand-mark"><i class="bi bi-shield-check"></i></span>
          <span>
            <strong>Prep Sant&eacute;</strong>
            <small>Pr&eacute;paration aux Urgences</small>
          </span>
        </a>

        <div class="auth-heading">
          <p class="eyebrow mb-1">Verification</p>
          <h1 id="otpTitle">Code recu par email</h1>
          <p>Saisissez le code envoye a votre adresse email pour continuer la reinitialisation.</p>
        </div>

        <form class="auth-form" action="login.html">
          <div>
            <label class="form-label" for="otpCode">Code de verification</label>
            <div class="input-group">
              <span class="input-group-text"><i class="bi bi-key"></i></span>
              <input class="form-control otp-input" id="otpCode" name="otp" type="text" inputmode="numeric" autocomplete="one-time-code" placeholder="000000" minlength="6" maxlength="6" pattern="[0-9]{6}" required>
            </div>
          </div>

          <button class="btn btn-primary auth-submit" type="submit">
            <i class="bi bi-check2-circle"></i>
            Verifier le code
          </button>
        </form>

        <div class="auth-actions">
          <a href="forgot.html">Renvoyer le code</a>
          <a href="login.html">Retour a la connexion</a>
        </div>
      </section>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="assets/app.js"></script>
  </body>
</html>
